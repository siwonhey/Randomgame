<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLITZ — Random Selection Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ─── Bottom black gradient — visible during the landing splash and
       fades out as the setup card slides up, so the card reads as
       emerging from darkness on first load. ─── -->
  <div id="card-entrance-gradient" aria-hidden="true"></div>

  <!-- ─── Landing splash (plays LOGO.mp4 once on initial page load) ─── -->
  <div id="landing-splash">
    <video id="landing-logo" autoplay muted playsinline preload="auto">
      <source src="LOGO.mp4" type="video/mp4">
    </video>
    <div id="landing-loading" aria-hidden="true">
      <span>L</span><span>o</span><span>a</span><span>d</span><span>i</span><span>n</span><span>g</span><span>.</span><span>.</span><span>.</span>
    </div>
  </div>

  <!-- ─── Three.js arena ─── -->
  <div id="game-area">
    <div id="title-hud"></div>
    <div id="status-bar"></div>
    <div id="timer-display"></div>
    <div id="countdown"></div>
    <div id="pause-indicator">
      <div class="pause-bars"><span></span><span></span></div>
      <div class="pause-label">PAUSED</div>
      <div class="pause-hint">CLICK TO RESUME</div>
    </div>
  </div>

  <!-- ─── Brand block (fixed top-left, persists from input → game → result) ─── -->
  <header class="brand-block">
    <div class="brand-mark">
      <img src="logo.jpg" alt="BLITZ" class="brand-icon">
    </div>
  </header>

  <!-- ─── Popup mode chrome (gear during battle, backdrop dim) ─── -->
  <div id="popup-backdrop"></div>
  <button id="popup-toggle" title="Edit Participants" aria-label="Edit Participants">&#x2699;</button>

  <!-- ─── Setup Panel ─── -->
  <section id="setup-panel">
    <div class="setup-card">
      <button id="popup-close" title="Close" aria-label="Close">&times;</button>

      <!-- TITLE field -->
      <div class="field-block">
        <label class="field-label" for="event-title">TITLE</label>
        <input type="text" id="event-title" placeholder="TITLE NAME" spellcheck="false" autocomplete="off">
      </div>

      <!-- PARTICIPANTS field -->
      <div class="field-block">
        <div class="field-header">
          <span class="field-label">PARTICIPANTS</span>
        </div>

        <div class="name-input-row">
          <input type="text" id="name-input" placeholder="PARTICIPANT NAME" spellcheck="false" autocomplete="off">
        </div>

        <!-- Card-embedded roster -->
        <aside class="roster-block roster-card">
          <div class="participants-wrap">
            <div class="participants"></div>
          </div>
        </aside>

      </div>

      <!-- START GAME row: mute toggle + shuffle icon + primary CTA -->
      <div class="cta-row">
        <button id="sound-toggle" title="Toggle Sound" aria-label="Toggle Sound">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>
        <div class="shuffle-wrap">
          <button id="shuffle-btn" type="button" title="Shuffle" aria-label="Shuffle participants">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
          </button>
          <!-- First-visit hint: dismissed via X, never reappears within session -->
          <div id="shuffle-hint" role="tooltip">
            <span class="hint-text">참가자의 순서와 색상, 스택을<br>한번에 섞어요</span>
            <button class="hint-close" type="button" aria-label="안내 닫기">&times;</button>
          </div>
        </div>
        <button id="battle-btn" class="primary-btn" disabled>START GAME</button>
      </div>
    </div>
  </section>

  <!-- ─── Corner Roster (battle HUD, fades in once card fades out) ─── -->
  <aside class="roster-block roster-corner">
    <div class="participants-wrap">
      <div class="participants"></div>
    </div>
    <div class="col-label">
      <span>PARTICIPANTS</span>
      <span class="count-display count-display-hud">0 / 30</span>
    </div>
  </aside>

  <!-- ─── Result Overlay ─── -->
  <div id="result-overlay">
    <div class="result-content">
      <div id="result-3d"></div>
      <div class="result-winner-block">
        <div id="result-title">WINNER</div>
        <div id="result-winner-name"></div>
      </div>
      <div id="result-list"></div>
      <div class="result-actions">
        <button id="btn-copy" class="pill-btn pill-btn-result">COPY RESULTS</button>
        <button id="btn-retry" class="pill-btn pill-btn-result">PLAY AGAIN</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module" src="js/main.js"></script>
</body>
</html>
