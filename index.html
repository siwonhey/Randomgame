<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLITZ — Random Selection Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ─── Three.js arena ─── -->
  <div id="game-area">
    <div id="title-hud"></div>
    <div id="status-bar"></div>
    <div id="timer-display"></div>
    <div id="countdown"></div>
    <div id="pause-indicator">
      <div class="pause-bars"><span></span><span></span></div>
      <div class="pause-label">PAUSED</div>
      <div class="pause-hint">CLICK TO RESUME</div>
    </div>
  </div>

  <!-- ─── Brand block (fixed top-left, persists from input → game → result) ─── -->
  <header class="brand-block">
    <div class="brand-mark">
      <img src="logo.jpg" alt="BLITZ" class="brand-icon">
    </div>
  </header>

  <!-- ─── Popup mode chrome (backdrop dim used when popup-open is set) ─── -->
  <div id="popup-backdrop"></div>
  <!-- Top-right control during battle: mute toggle (mirrors the input page
       sound-toggle, kept in sync via JS). Replaces the previous gear that
       opened the participant editor mid-battle. -->
  <button id="popup-toggle" title="Toggle Sound" aria-label="Toggle Sound">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
  </button>

  <!-- ─── Setup Panel ─── -->
  <section id="setup-panel">
    <div class="setup-card">
      <button id="popup-close" title="Close" aria-label="Close">&times;</button>

      <!-- TITLE field -->
      <div class="field-block">
        <div class="field-header">
          <label class="field-label" for="event-title">TITLE</label>
          <span class="field-limit" id="title-limit" aria-hidden="true">10자 이내로 작성해주세요</span>
        </div>
        <div class="input-box">
          <input type="text" id="event-title" placeholder="배틀 타이틀을 입력하세요" maxlength="10" spellcheck="false" autocomplete="off">
          <span class="field-ph" aria-hidden="true"><b>배틀 타이틀</b><span class="ph-tail">을 입력하세요</span></span>
        </div>
      </div>

      <!-- PARTICIPANTS field -->
      <div class="field-block">
        <div class="field-header">
          <span class="field-label">PARTICIPANTS</span>
          <span class="field-limit" id="participant-limit" aria-hidden="true">최대 30명까지 입력할 수 있어요</span>
        </div>

        <div class="name-input-row">
          <input type="text" id="name-input" placeholder="참가자 이름을 입력하세요" spellcheck="false" autocomplete="off">
          <span class="field-ph" aria-hidden="true"><b>참가자 이름</b>을 입력하세요</span>
          <button id="name-submit" type="button" title="Add participant" aria-label="Add participant">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>

        <!-- Card-embedded roster -->
        <aside class="roster-block roster-card">
          <div class="participants-wrap">
            <div class="participants"></div>
          </div>
        </aside>

      </div>

      <!-- START GAME row: mute toggle + shuffle icon + primary CTA -->
      <div class="cta-row">
        <button id="sound-toggle" title="Toggle Sound" aria-label="Toggle Sound">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>
        <div class="shuffle-wrap">
          <button id="shuffle-btn" type="button" title="Shuffle" aria-label="Shuffle participants">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
          </button>
          <!-- First-visit hint: dismissed via X, never reappears within session -->
          <div id="shuffle-hint" role="tooltip">
            <span class="hint-text">참가자의 순서와 색상, 스택을 한 번에 섞어요</span>
            <button class="hint-close" type="button" aria-label="안내 닫기">&times;</button>
          </div>
        </div>
        <button id="battle-btn" class="primary-btn" disabled>START GAME</button>
      </div>
    </div>
  </section>

  <!-- ─── Corner Roster (battle HUD, fades in once card fades out) ─── -->
  <aside class="roster-block roster-corner">
    <div class="participants-wrap">
      <div class="participants"></div>
    </div>
  </aside>

  <!-- ─── Result Overlay ─── -->
  <div id="result-overlay">
    <div class="result-content">
      <div id="result-3d"></div>
      <div class="result-winner-block">
        <div id="result-title">WINNER</div>
        <div id="result-winner-name"></div>
      </div>
      <div id="result-list"></div>
      <div class="result-actions">
        <button id="btn-copy" class="pill-btn pill-btn-result">COPY RESULTS</button>
        <button id="btn-retry" class="pill-btn pill-btn-result">PLAY AGAIN</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module" src="js/main.js"></script>
</body>
</html>
