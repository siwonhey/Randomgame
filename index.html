<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLITZ — Random Selection Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ─── Landing splash (plays LOGO.mp4 once on initial page load) ─── -->
  <div id="landing-splash">
    <video id="landing-logo" autoplay muted playsinline preload="auto">
      <source src="LOGO.mp4" type="video/mp4">
    </video>
  </div>

  <!-- ─── Three.js arena ─── -->
  <div id="game-area">
    <div id="title-hud"></div>
    <div id="status-bar"></div>
    <div id="timer-display"></div>
    <div id="countdown"></div>
  </div>

  <!-- ─── Brand block (fixed top-left, persists from input → game → result) ─── -->
  <header class="brand-block">
    <div class="brand-mark">
      <img src="LOGO.png" alt="BLITZ" class="brand-icon">
    </div>
    <p class="brand-tagline">DRIVEN BY PHYSICS — THE EXPERIENCE OF RANDOM<br>SELECTION THROUGH VISUAL COLLISION.</p>
  </header>

  <!-- ─── Sound Toggle (fixed top-right) ─── -->
  <button id="sound-toggle" title="Toggle Sound" aria-label="Toggle Sound">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
  </button>

  <!-- ─── Popup mode chrome (gear during battle, backdrop dim) ─── -->
  <div id="popup-backdrop"></div>
  <button id="popup-toggle" title="Edit Participants" aria-label="Edit Participants">&#x2699;</button>

  <!-- ─── Setup Panel ─── -->
  <section id="setup-panel">
    <div class="setup-card">
      <button id="popup-close" title="Close" aria-label="Close">&times;</button>

      <!-- TITLE field -->
      <div class="field-block">
        <label class="field-label" for="event-title">TITLE</label>
        <input type="text" id="event-title" placeholder="TITLE" spellcheck="false" autocomplete="off">
      </div>

      <!-- PARTICIPANTS field -->
      <div class="field-block">
        <div class="field-header">
          <span class="field-label">PARTICIPANTS</span>
          <span class="count-badge count-display">0</span>
        </div>

        <div class="name-input-row">
          <input type="text" id="name-input" placeholder="Participant Name" spellcheck="false" autocomplete="off">
          <button id="add-btn" title="Add" aria-label="Add">+</button>
        </div>

        <div class="action-buttons">
          <button id="csv-upload-btn" class="pill-btn pill-btn-csv" type="button">
            <span>CSV UPLOAD</span>
            <span class="help-icon" data-tooltip="CSV 파일을 업로드해 참가자를 한 번에 추가합니다. 줄바꿈 또는 쉼표로 이름을 구분하세요.">?</span>
          </button>
          <button id="shuffle-btn" class="pill-btn pill-btn-shuffle" type="button">
            <svg class="btn-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
            <span>SHUFFLE</span>
            <span class="help-icon" data-tooltip="참가자 순서와 팽이 색상을 무작위로 다시 배정합니다.">?</span>
          </button>
          <input type="file" id="csv-input" accept=".csv,.txt,.tsv">
        </div>

        <!-- Card-embedded roster -->
        <aside class="roster-block roster-card">
          <div class="participants-wrap">
            <div class="participants"></div>
          </div>
        </aside>
      </div>

      <!-- START GAME -->
      <button id="battle-btn" class="primary-btn" disabled>START GAME</button>
    </div>
  </section>

  <!-- ─── Corner Roster (battle HUD, fades in once card fades out) ─── -->
  <aside class="roster-block roster-corner">
    <div class="participants-wrap">
      <div class="participants"></div>
    </div>
    <div class="col-label">
      <span>PARTICIPANTS</span>
      <span class="count-display count-display-hud">0 / 30</span>
    </div>
  </aside>

  <!-- ─── Result Overlay ─── -->
  <div id="result-overlay">
    <div class="result-content">
      <div id="result-3d"></div>
      <div class="result-winner-block">
        <div id="result-title">WINNER</div>
        <div id="result-winner-name"></div>
      </div>
      <div id="result-list"></div>
      <div class="result-actions">
        <button id="btn-copy" class="pill-btn pill-btn-result">COPY RESULTS</button>
        <button id="btn-retry" class="pill-btn pill-btn-result">PLAY AGAIN</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module" src="js/main.js"></script>
</body>
</html>
